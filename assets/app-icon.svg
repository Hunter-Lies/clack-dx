<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <!-- 白底。纯白在浅色桌面上会看不出边界，所以勾一道极淡的描边 -->
  <rect x="2" y="2" width="1020" height="1020" rx="226" fill="#ffffff"
        stroke="#292926" stroke-opacity="0.09" stroke-width="4"/>
  <!-- 等距立方体：三个面都看得见，一眼是"3D 图形"，缩到 16px 也不糊。
       线宽 2.6（24 格视图里）是按小尺寸调的，细了在任务栏上会发灰。 -->
  <svg x="205" y="205" width="614" height="614" viewBox="0 0 24 24"
       fill="none" stroke="#ff4f00" stroke-width="2.6"
       stroke-linecap="round" stroke-linejoin="round">
    <path d="M12 2 20.66 7v10L12 22 3.34 17V7z"/>
    <path d="M12 12l8.66-5M12 12 3.34 7M12 12v10"/>
  </svg>
</svg>
